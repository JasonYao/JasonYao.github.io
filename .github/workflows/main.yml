name: build-and-benchmark

on:
  push:
    branches-ignore:
      - publish

  schedule:
    # Runs on the 1st of every month at 2PM
    - cron: "0 14 1 * *"

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          fetch-depth: 0
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2

      # We use apt here instead of sudo snap install hugo
      # since there have been lots of instances of that step hanging
      # For multiple minutes on "INFO Waiting for automatic snapd restart..."
      - name: Setup Hugo
        run: |
          sudo apt-get update
          sudo apt-get install -y hugo

      - uses: actions/cache@v6
        with:
          path: /tmp/hugo_cache
          key: ${{ runner.os }}-hugomod-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-hugomod-

      - name: Build site
        run: bin/build

      - name: Validate build
        run: bin/validate

      - name: Benchmark
        run: |
          python3 bin/lighthouse_config.py > "${RUNNER_TEMP}/lighthouserc.json"
          bunx --yes @lhci/cli@0.16.0 autorun --config="${RUNNER_TEMP}/lighthouserc.json" --upload.target=filesystem

      - name: Generate Lighthouse score screenshots
        if: github.event_name == 'push' && github.ref_name != 'source' && github.ref_name != 'publish'
        run: bun run bin/lighthouse_screenshots.ts

      - name: Upload Lighthouse reports
        id: upload-lighthouse-reports
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-reports
          path: .lighthouseci/
          if-no-files-found: error
          include-hidden-files: true

      - name: Comment on pull request with benchmark artifact
        if: >-
          (github.event_name == 'push' &&
          github.ref_name != 'source' && github.ref_name != 'publish')
        env:
          DEPLOY_ACCESS_TOKEN: ${{ secrets.DEPLOY_ACCESS_TOKEN }}
          ARTIFACT_URL: ${{ steps.upload-lighthouse-reports.outputs.artifact-url }}
          GITHUB_REPOSITORY_ID: ${{ github.repository_id }}
        run: bin/pr_comment

      - name: Upload site for deployment
        if: github.event_name == 'push' && github.ref == 'refs/heads/source'
        uses: actions/upload-artifact@v7
        with:
          name: site-public
          path: public/
          if-no-files-found: error

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/source'
    needs: build_and_deploy
    runs-on: ubuntu-latest
    environment: deploy

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v7
        with:
          name: site-public
          path: public/

      - name: Deploy site
        env:
          SOURCE_DEPLOY_PAT: ${{ secrets.SOURCE_DEPLOY_PAT }}
        run: bin/deploy source
