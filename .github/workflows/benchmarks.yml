# This is a basic workflow to help you get started with Actions

name: Site Benchmarking

# We only want to run our benchmarks on a new publish
on:
  push:
    branches:
      - publish

  schedule:
    # Runs on the 1st of every month at 3PM
    - cron: "0 15 1 * *"

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  benchmark:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      - uses: actions/checkout@v7
        with:
          ref: publish

      - uses: oven-sh/setup-bun@v2

      - name: Run Lighthouse against a static dist dir
        run: bunx --yes @lhci/cli@0.14.0 autorun --config=.github/workflows/resources/lighthouserc.json --upload.target=temporary-public-storage

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: .lighthouseci/
          if-no-files-found: warn
