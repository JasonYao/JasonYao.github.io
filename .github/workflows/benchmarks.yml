name: Site Benchmarking

on:
  push:
    branches:
      - source
  pull_request:
    branches:
      - source

jobs:
  create-a-build-and-then-lighthouse-that-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2

      - name: Setup Hugo
        run: sudo snap install hugo

      - name: Build site
        run: bin/build

      - name: Run Lighthouse against the build
        run: bunx --yes @lhci/cli@0.16.0 autorun --config=.github/workflows/resources/lighthouserc.json --upload.target=temporary-public-storage
